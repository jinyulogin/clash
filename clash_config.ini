; ============================================================
; Subconverter 配置（按区域分流）
;
; 1. 节点按 US/HK/JP/SG/TW/KR 划分
; 2. 自动组用 url-test：超时/失败节点不会被选中
; 3. 日本自动仅 *ws，排除易 error 的 JP SSR
; 4. 手动选择：全部 u9un- 节点可选
;
; 测速：http://cp.cloudflare.com/generate_204 ，180s / 5s / 80ms
; ============================================================

; ============================================================
; 1. 规则集
; ============================================================

; AI
ruleset = 👽 AI,https://raw.githubusercontent.com/liandu2024/clash/main/list/AI.list

; GitHub
ruleset = 📘 GitHub,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GitHub/GitHub.list

; TikTok
ruleset = 👯‍♂️ TikTok,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/TikTok/TikTok.list

; Telegram
ruleset = 🙋 Telegram,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Telegram/Telegram.list

; ----------------------------
; 流媒体（YouTube 双来源 + HBO / Disney+ / Netflix / Spotify）
; ----------------------------

ruleset = 📀 流媒体,https://raw.githubusercontent.com/liandu2024/clash/main/list/YouTube.list
ruleset = 📀 流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.list
ruleset = 📀 流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/HBO/HBO.list
ruleset = 📀 流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Disney/Disney.list
ruleset = 📀 流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Netflix/Netflix.list
ruleset = 📀 流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Spotify/Spotify.list

; ----------------------------
; 其他国外
; ----------------------------

ruleset = 🌍 国外,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Global/Global.list

; ----------------------------
; 国内及最终
; ----------------------------

ruleset = ➡️ 国内,[]GEOIP,CN
ruleset = 🌍 国外,[]FINAL

; ============================================================
; 2. 业务策略组（第一项 = 默认）
; ============================================================

; AI：美国优先
custom_proxy_group = 👽 AI`select`[]🇺🇸 美国-自动`[]🇸🇬 新加坡-自动`[]🇭🇰 香港-自动`[]✋ 手动选择`[]🇯🇵 日本-自动`[]🇹🇼 台湾-自动`[]🇰🇷 韩国-自动`[]🌏 所有-自动`[]DIRECT`[]REJECT

; 流媒体：香港优先
custom_proxy_group = 📀 流媒体`select`[]🇭🇰 香港-自动`[]🇹🇼 台湾-自动`[]🇸🇬 新加坡-自动`[]🇯🇵 日本-自动`[]🇺🇸 美国-自动`[]🇰🇷 韩国-自动`[]✋ 手动选择`[]🌏 所有-自动`[]DIRECT`[]REJECT

; GitHub：美国优先
custom_proxy_group = 📘 GitHub`select`[]🇺🇸 美国-自动`[]🇸🇬 新加坡-自动`[]🇭🇰 香港-自动`[]✋ 手动选择`[]🇯🇵 日本-自动`[]🇹🇼 台湾-自动`[]🇰🇷 韩国-自动`[]🌏 所有-自动`[]DIRECT`[]REJECT

; TikTok：美国优先
custom_proxy_group = 👯‍♂️ TikTok`select`[]🇺🇸 美国-自动`[]🇸🇬 新加坡-自动`[]🇯🇵 日本-自动`[]🇹🇼 台湾-自动`[]🇭🇰 香港-自动`[]✋ 手动选择`[]🌏 所有-自动`[]DIRECT`[]REJECT

; Telegram：新加坡优先
custom_proxy_group = 🙋 Telegram`select`[]🇸🇬 新加坡-自动`[]🇭🇰 香港-自动`[]🇺🇸 美国-自动`[]✋ 手动选择`[]🇯🇵 日本-自动`[]🇹🇼 台湾-自动`[]🇰🇷 韩国-自动`[]🌏 所有-自动`[]DIRECT`[]REJECT

; 其他国外：香港优先
custom_proxy_group = 🌍 国外`select`[]🇭🇰 香港-自动`[]🇸🇬 新加坡-自动`[]🇯🇵 日本-自动`[]🇹🇼 台湾-自动`[]🇺🇸 美国-自动`[]🇰🇷 韩国-自动`[]✋ 手动选择`[]🌏 所有-自动`[]DIRECT`[]REJECT

; 国内：直连优先
custom_proxy_group = ➡️ 国内`select`[]DIRECT`[]✋ 手动选择`[]🇭🇰 香港-自动`[]🌏 所有-自动`[]REJECT

; 手动：全部 u9un- 可选
custom_proxy_group = ✋ 手动选择`select`(u9un-)

; ============================================================
; 3. 自动测速组（按区域）
; 参数：URL`间隔秒,超时秒,容差毫秒
; url-test 超时/失败节点不会被选用
; ============================================================

; 全部（排除易 error 的 JP SSR：Tokyo1-6 无 ws）
custom_proxy_group = 🌏 所有-自动`url-test`(u9un-(?!JP-Tokyo[1-6]$))`http://cp.cloudflare.com/generate_204`180,5,80

; 美国
custom_proxy_group = 🇺🇸 美国-自动`url-test`(u9un-US-)`http://cp.cloudflare.com/generate_204`180,5,80

; 日本（仅 *ws，不显示 SSR）
custom_proxy_group = 🇯🇵 日本-自动`url-test`(u9un-JP-.*ws)`http://cp.cloudflare.com/generate_204`180,5,80

; 新加坡
custom_proxy_group = 🇸🇬 新加坡-自动`url-test`(u9un-SG-)`http://cp.cloudflare.com/generate_204`180,5,80

; 台湾
custom_proxy_group = 🇹🇼 台湾-自动`url-test`(u9un-TW-)`http://cp.cloudflare.com/generate_204`180,5,80

; 香港
custom_proxy_group = 🇭🇰 香港-自动`url-test`(u9un-HK-)`http://cp.cloudflare.com/generate_204`180,5,80

; 韩国
custom_proxy_group = 🇰🇷 韩国-自动`url-test`(u9un-KR-)`http://cp.cloudflare.com/generate_204`180,5,80

; ============================================================
; 4. 规则生成
; ============================================================

enable_rule_generator = true
overwrite_original_rules = true
