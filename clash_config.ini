;3、节点组（仅保留 u9un 实际有的区域；无「其他」）
; 所有：排除易 error 的 JP SSR（Tokyo1-6 无 ws）
custom_proxy_group=所有-自动`url-test`(u9un-(?!JP-Tokyo[1-6]$))`http://www.gstatic.com/generate_204`180,5,100
custom_proxy_group=港台日新韩-自动`url-test`(u9un-(HK|TW|SG|KR)-|u9un-JP-.*ws)`http://www.gstatic.com/generate_204`180,5,100
custom_proxy_group=台日新韩-自动`url-test`(u9un-(TW|SG|KR)-|u9un-JP-.*ws)`http://www.gstatic.com/generate_204`180,5,100
custom_proxy_group=香港-自动`url-test`(u9un-HK-)`http://www.gstatic.com/generate_204`180,5,100
custom_proxy_group=台湾-自动`url-test`(u9un-TW-)`http://www.gstatic.com/generate_204`180,5,100
custom_proxy_group=日本-自动`url-test`(u9un-JP-.*ws)`http://www.gstatic.com/generate_204`180,5,100
custom_proxy_group=新加坡-自动`url-test`(u9un-SG-)`http://www.gstatic.com/generate_204`180,5,100
custom_proxy_group=韩国-自动`url-test`(u9un-KR-)`http://www.gstatic.com/generate_204`180,5,100
custom_proxy_group=美国-自动`url-test`(u9un-US-)`http://www.gstatic.com/generate_204`180,5,100

