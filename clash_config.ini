; ============================================================
; Sub-Converter 原始规则模板
; 用途：OpenClash / Clash 订阅转换
; ============================================================

; ==================== 一、规则集 ====================

; Cursor 专用规则
ruleset=👽 AI,[]DOMAIN-SUFFIX,cursor.sh
ruleset=👽 AI,[]DOMAIN-SUFFIX,cursor.com
ruleset=👽 AI,[]DOMAIN-SUFFIX,cursorapi.com
ruleset=👽 AI,[]DOMAIN-KEYWORD,cursorapi

; AI 规则
ruleset=👽 AI,https://raw.githubusercontent.com/liandu2024/clash/main/list/AI.list

; GitHub
ruleset=📘 GitHub,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GitHub/GitHub.list

; TikTok
ruleset=👯‍♂️ TikTok,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/TikTok/TikTok.list

; Telegram
ruleset=🙋 Telegram,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Telegram/Telegram.list

; YouTube：保留原有双来源规则
ruleset=📀 流媒体,https://raw.githubusercontent.com/liandu2024/clash/main/list/YouTube.list
ruleset=📀 流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.list

; HBO
ruleset=📀 流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/HBO/HBO.list

; Disney+
ruleset=📀 流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Disney/Disney.list

; Netflix
ruleset=📀 流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Netflix/Netflix.list

; Spotify
ruleset=📀 流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Spotify/Spotify.list

; 其他国外规则
ruleset=🌍 国外,https://raw.githubusercontent.com/liandu2024/clash/main/list/Check.list
ruleset=🌍 国外,https://raw.githubusercontent.com/liandu2024/clash/main/list/Proxy.list
ruleset=🌍 国外,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Global/Global.list

; 国内规则
ruleset=➡️ 国内,[]GEOIP,CN

; 兜底规则
ruleset=🌍 国外,[]FINAL


; ==================== 二、业务策略组 ====================

; AI：美国优先
custom_proxy_group=👽 AI`select`[]🇺🇸 美国-自动`[]🇸🇬 新加坡`[]🇭🇰 香港`[]✋ 手动`[]🇯🇵 日本`[]🇹🇼 台湾`[]🇰🇷 韩国`[]♻️ 所有`[]DIRECT`[]REJECT

; 流媒体：香港优先
custom_proxy_group=📀 流媒体`select`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇸🇬 新加坡`[]🇯🇵 日本`[]🇺🇸 美国`[]🇰🇷 韩国`[]✋ 手动`[]♻️ 所有`[]DIRECT`[]REJECT

; GitHub：美国优先
custom_proxy_group=📘 GitHub`select`[]🇺🇸 美国-自动`[]🇸🇬 新加坡`[]🇭🇰 香港`[]✋ 手动`[]🇯🇵 日本`[]🇹🇼 台湾`[]🇰🇷 韩国`[]♻️ 所有`[]DIRECT`[]REJECT

; TikTok：美国优先
custom_proxy_group=👯‍♂️ TikTok`select`[]🇺🇸 美国-自动`[]🇸🇬 新加坡`[]🇯🇵 日本`[]🇹🇼 台湾`[]🇭🇰 香港`[]✋ 手动`[]♻️ 所有`[]DIRECT`[]REJECT

; Telegram：新加坡优先
custom_proxy_group=🙋 Telegram`select`[]🇸🇬 新加坡`[]🇭🇰 香港`[]🇺🇸 美国-自动`[]✋ 手动`[]🇯🇵 日本`[]🇹🇼 台湾`[]🇰🇷 韩国`[]♻️ 所有`[]DIRECT`[]REJECT

; 其他国外：香港优先
custom_proxy_group=🌍 国外`select`[]🇭🇰 香港`[]🇸🇬 新加坡`[]🇯🇵 日本`[]🇹🇼 台湾`[]🇺🇸 美国-自动`[]🇰🇷 韩国`[]✋ 手动`[]♻️ 所有`[]DIRECT`[]REJECT

; 国内：直连优先
custom_proxy_group=➡️ 国内`select`[]DIRECT`[]✋ 手动`[]🇭🇰 香港`[]♻️ 所有`[]REJECT


; ==================== 三、手动节点选择 ====================

; 排除名称严格以 JP-Tokyo1 至 JP-Tokyo6 结尾的节点
custom_proxy_group=✋ 手动`select`(u9un-(?!JP-Tokyo[1-6]$))


; ==================== 四、自动测速策略组 ====================

; 测速参数：URL、间隔 180 秒、超时 5 秒、容差 80 毫秒
; 全部节点：排除指定的旧日本节点
custom_proxy_group=♻️ 所有`url-test`(u9un-(?!JP-Tokyo[1-6]$))`http://cp.cloudflare.com/generate_204`180,5,80

; 美国
custom_proxy_group=🇺🇸 美国-自动`url-test`(u9un-US-)`http://cp.cloudflare.com/generate_204`180,5,80

; 日本：仅匹配节点名称中包含 ws 的节点
custom_proxy_group=🇯🇵 日本`url-test`(u9un-JP-.*ws)`http://cp.cloudflare.com/generate_204`180,5,80

; 新加坡
custom_proxy_group=🇸🇬 新加坡`url-test`(u9un-SG-)`http://cp.cloudflare.com/generate_204`180,5,80

; 台湾
custom_proxy_group=🇹🇼 台湾`url-test`(u9un-TW-)`http://cp.cloudflare.com/generate_204`180,5,80

; 香港
custom_proxy_group=🇭🇰 香港`url-test`(u9un-HK-)`http://cp.cloudflare.com/generate_204`180,5,80

; 韩国
custom_proxy_group=🇰🇷 韩国`url-test`(u9un-KR-)`http://cp.cloudflare.com/generate_204`180,5,80


; ==================== 五、生成设置 ====================

enable_rule_generator=true
overwrite_original_rules=true
