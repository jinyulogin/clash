ruleset = 🌍 国外,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Global/Global.list

ruleset = ➡️ 国内,[]GEOIP,CN
ruleset = 🌍 国外,[]FINAL

; ===============================
; 2. 业务策略（第一项为默认）
; ===============================

; AI：默认美国，可手动改
custom_proxy_group = 👽 AI`select`[]🇺🇸 美国-自动`[]✋ 手动选择`[]🇯🇵 日本-自动`[]🇸🇬 新加坡-自动`[]🇹🇼 台湾-自动`[]🇭🇰 香港-自动`[]🇰🇷 韩国-自动`[]🌏 所有-自动`[]DIRECT`[]REJECT

; 流媒体：默认全部节点测速，可手动改地区或单节点
custom_proxy_group = 📀 流媒体`select`[]🌏 所有-自动`[]🇭🇰 香港-自动`[]🇹🇼 台湾-自动`[]🇯🇵 日本-自动`[]🇸🇬 新加坡-自动`[]🇰🇷 韩国-自动`[]🇺🇸 美国-自动`[]✋ 手动选择`[]DIRECT`[]REJECT

; 国外（含 GitHub / TikTok / Telegram）：默认美国，可手动改
custom_proxy_group = 📘 GitHub`select`[]🇺🇸 美国-自动`[]✋ 手动选择`[]🇯🇵 日本-自动`[]🇸🇬 新加坡-自动`[]🇹🇼 台湾-自动`[]🇭🇰 香港-自动`[]🇰🇷 韩国-自动`[]🌏 所有-自动`[]DIRECT`[]REJECT
custom_proxy_group = 👯‍♂️ TikTok`select`[]🇺🇸 美国-自动`[]✋ 手动选择`[]🇸🇬 新加坡-自动`[]🇯🇵 日本-自动`[]🇹🇼 台湾-自动`[]🇭🇰 香港-自动`[]🌏 所有-自动`[]DIRECT`[]REJECT
custom_proxy_group = 🙋 Telegram`select`[]🇺🇸 美国-自动`[]✋ 手动选择`[]🇯🇵 日本-自动`[]🇸🇬 新加坡-自动`[]🇹🇼 台湾-自动`[]🇭🇰 香港-自动`[]🇰🇷 韩国-自动`[]🌏 所有-自动`[]DIRECT`[]REJECT
custom_proxy_group = 🌍 国外`select`[]🇺🇸 美国-自动`[]✋ 手动选择`[]🇯🇵 日本-自动`[]🇸🇬 新加坡-自动`[]🇹🇼 台湾-自动`[]🇭🇰 香港-自动`[]🇰🇷 韩国-自动`[]🌏 所有-自动`[]DIRECT`[]REJECT

; 国内：默认直连，需要时再手动改
custom_proxy_group = ➡️ 国内`select`[]DIRECT`[]✋ 手动选择`[]🇺🇸 美国-自动`[]🌏 所有-自动`[]REJECT

; 手动选单个节点
custom_proxy_group = ✋ 手动选择`select`(u9un-)

; ===============================
; 3. 自动测速（节点名 u9un-地区-）
; 300 秒测一次，超时 5000ms，容差 100ms
; ===============================

custom_proxy_group = 🌏 所有-自动`url-test`(u9un-)`https://www.gstatic.com/generate_204`300,5000,100
custom_proxy_group = 🇺🇸 美国-自动`url-test`(u9un-US-)`https://www.gstatic.com/generate_204`300,5000,100
custom_proxy_group = 🇯🇵 日本-自动`url-test`(u9un-JP-)`https://www.gstatic.com/generate_204`300,5000,100
custom_proxy_group = 🇸🇬 新加坡-自动`url-test`(u9un-SG-)`https://www.gstatic.com/generate_204`300,5000,100
custom_proxy_group = 🇹🇼 台湾-自动`url-test`(u9un-TW-)`https://www.gstatic.com/generate_204`300,5000,100
custom_proxy_group = 🇭🇰 香港-自动`url-test`(u9un-HK-)`https://www.gstatic.com/generate_204`300,5000,100
custom_proxy_group = 🇰🇷 韩国-自动`url-test`(u9un-KR-)`https://www.gstatic.com/generate_204`300,5000,100

; ===============================
; 4. 覆盖原规则
; ===============================

enable_rule_generator = true
overwrite_original_rules = true
