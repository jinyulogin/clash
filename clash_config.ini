; ----------------------------
; 国外流量
; ----------------------------

ruleset = 🌍 国外,https://raw.githubusercontent.com/liandu2024/clash/refs/heads/main/list/Check.list
ruleset = 🌍 国外,https://raw.githubusercontent.com/liandu2024/clash/refs/heads/main/list/Proxy.list
ruleset = 🌍 国外,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Global/Global.list

; ----------------------------
; 国内流量及最终规则
; ----------------------------

ruleset = ➡️ 国内,[]GEOIP,CN
ruleset = 🌍 国外,[]FINAL

; ============================================================
; 2. 业务策略组
; 第一项为默认策略
; ============================================================

; ----------------------------
; AI
; 默认美国，优先使用美国地区自动测速
; ----------------------------

custom_proxy_group = 👽 AI`select`[]🇺🇸 美国-自动`[]✋ 手动选择`[]🇯🇵 日本-自动`[]🇸🇬 新加坡-自动`[]🇹🇼 台湾-自动`[]🇭🇰 香港-自动`[]🇰🇷 韩国-自动`[]🌏 所有-自动`[]DIRECT`[]REJECT

; ----------------------------
; 流媒体
; 默认所有节点自动测速
; 可手动切换到指定地区
; ----------------------------

custom_proxy_group = 📀 流媒体`select`[]🌏 所有-自动`[]🇭🇰 香港-自动`[]🇹🇼 台湾-自动`[]🇯🇵 日本-自动`[]🇸🇬 新加坡-自动`[]🇰🇷 韩国-自动`[]🇺🇸 美国-自动`[]✋ 手动选择`[]DIRECT`[]REJECT

; ----------------------------
; GitHub
; ----------------------------

custom_proxy_group = 📘 GitHub`select`[]🇺🇸 美国-自动`[]✋ 手动选择`[]🇯🇵 日本-自动`[]🇸🇬 新加坡-自动`[]🇹🇼 台湾-自动`[]🇭🇰 香港-自动`[]🇰🇷 韩国-自动`[]🌏 所有-自动`[]DIRECT`[]REJECT

; ----------------------------
; TikTok
; ----------------------------

custom_proxy_group = 👯‍♂️ TikTok`select`[]🇺🇸 美国-自动`[]✋ 手动选择`[]🇸🇬 新加坡-自动`[]🇯🇵 日本-自动`[]🇹🇼 台湾-自动`[]🇭🇰 香港-自动`[]🌏 所有-自动`[]DIRECT`[]REJECT

; ----------------------------
; Telegram
; ----------------------------

custom_proxy_group = 🙋 Telegram`select`[]🇺🇸 美国-自动`[]✋ 手动选择`[]🇯🇵 日本-自动`[]🇸🇬 新加坡-自动`[]🇹🇼 台湾-自动`[]🇭🇰 香港-自动`[]🇰🇷 韩国-自动`[]🌏 所有-自动`[]DIRECT`[]REJECT

; ----------------------------
; 普通国外流量
; ----------------------------

custom_proxy_group = 🌍 国外`select`[]🇺🇸 美国-自动`[]✋ 手动选择`[]🇯🇵 日本-自动`[]🇸🇬 新加坡-自动`[]🇹🇼 台湾-自动`[]🇭🇰 香港-自动`[]🇰🇷 韩国-自动`[]🌏 所有-自动`[]DIRECT`[]REJECT

; ----------------------------
; 国内流量
; ----------------------------

custom_proxy_group = ➡️ 国内`select`[]DIRECT`[]✋ 手动选择`[]🇺🇸 美国-自动`[]🌏 所有-自动`[]REJECT

; ----------------------------
; 手动选择单个节点
; ----------------------------

custom_proxy_group = ✋ 手动选择`select`(u9un-)

; ============================================================
; 3. 自动测速组
;
; 参数顺序：
; 测速 URL、测速间隔（秒）、超时时间（秒）、容差（毫秒）
;
; 300 = 每 300 秒测速
; 5   = 请求超时 5 秒
; 100 = 延迟容差 100 毫秒
; ============================================================

; ----------------------------
; 全部节点
; ----------------------------

custom_proxy_group = 🌏 所有-自动`url-test`(u9un-)`http://www.gstatic.com/generate_204`300,5,100

; ----------------------------
; 美国
; ----------------------------

custom_proxy_group = 🇺🇸 美国-自动`url-test`(u9un-US-)`http://www.gstatic.com/generate_204`300,5,100

; ----------------------------
; 日本
; ----------------------------

custom_proxy_group = 🇯🇵 日本-自动`url-test`(u9un-JP-)`http://www.gstatic.com/generate_204`300,5,100

; ----------------------------
; 新加坡
; ----------------------------

custom_proxy_group = 🇸🇬 新加坡-自动`url-test`(u9un-SG-)`http://www.gstatic.com/generate_204`300,5,100

; ----------------------------
; 台湾
; ----------------------------

custom_proxy_group = 🇹🇼 台湾-自动`url-test`(u9un-TW-)`http://www.gstatic.com/generate_204`300,5,100

; ----------------------------
; 香港
; ----------------------------

custom_proxy_group = 🇭🇰 香港-自动`url-test`(u9un-HK-)`http://www.gstatic.com/generate_204`300,5,100

; ----------------------------
; 韩国
; ----------------------------

custom_proxy_group = 🇰🇷 韩国-自动`url-test`(u9un-KR-)`http://www.gstatic.com/generate_204`300,5,100

; ============================================================
; 4. 规则生成
; ============================================================

enable_rule_generator = true
overwrite_original_rules = true
